<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow the Plant - ESL Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        h1 { color: #006064; text-align: center; }
        
        #game-board {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        /* Scene Styling */
        #scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 200px;
            margin-bottom: 20px;
            position: relative;
            border-bottom: 10px solid #795548; /* Dirt ground */
            padding-bottom: 10px;
        }

        #boy {
            font-size: 80px;
            margin-right: 20px;
            position: relative;
            z-index: 2;
        }

        #water-drop {
            font-size: 30px;
            position: absolute;
            left: 55%;
            top: 60px;
            opacity: 0;
            z-index: 3;
        }

        #plant {
            font-size: 80px;
            transition: transform 0.5s ease-in-out;
            z-index: 1;
        }

        /* Water Animation */
        @keyframes waterPlant {
            0% { top: 60px; opacity: 1; }
            80% { top: 150px; opacity: 1; }
            100% { top: 160px; opacity: 0; }
        }
        
        .watering {
            animation: waterPlant 1s linear;
        }

        /* Plant Growth Animation */
        @keyframes grow {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .growing {
            animation: grow 1s ease-in-out;
        }

        /* Controls */
        #water-btn {
            background-color: #00acc1;
            color: white;
            font-size: 1.2em;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        #water-btn:hover { background-color: #00838f; }
        #water-btn:disabled { background-color: #b2ebf2; cursor: not-allowed; }

        /* Quiz Section */
        #quiz-container {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f1f8e9;
            border: 2px solid #8bc34a;
            border-radius: 10px;
        }

        .option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 1.1em;
            background-color: white;
            border: 2px solid #00acc1;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover { background-color: #e0f7fa; }

        #feedback {
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1em;
        }

        #progress {
            margin-top: 15px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Grow the Plant! 🌱</h1>
    
    <div id="game-board">
        <div id="scene">
            <div id="boy">🧑‍🌾🚿</div>
            <div id="water-drop">💧</div>
            <div id="plant">🟫</div> <!-- Starts as just dirt -->
        </div>

        <button id="water-btn" onclick="startQuestion()">Water the Plant</button>

        <div id="progress">Stage 0 / 5</div>

        <div id="quiz-container">
            <h3 id="question-text"></h3>
            <div id="options-container"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        // Game Variables
        let currentStage = 0;
        const totalStages = 5;

        // Visual Stages of the Plant
        const plantStages = [
            "🟫", // 0: Dirt / Seed hidden
            "🌱", // 1: Sprout
            "🌿", // 2: Small Plant
            "🪴", // 3: Potted Plant
            "🌸", // 4: Budding Flower
            "🌻"  // 5: Full Blooming Flower
        ];

        // ESL Question Bank (Exactly 5 Questions)
        const questions = [
            { q: "What is the original verb of 'is/are/was/were'?", options: ["do", "have", "be"], correct: "be" },
            { q: "what is the past tense form for the verb 'go'?", options: ["goed", "went", "wented"], correct: "went" },
            { q: "A ________ of fish", options: ["group", "bunch", "school"], correct: "school" },
            { q: "Pronouns are words that refer or replace _________.", options: ["verbs", "nouns", "adjectives"], correct: "nouns" },
            { q: "Dear students, you must complete the assignment ________________.", options: ["yours", "yourself", "yourselves"], correct: "yourselves" }
        ];

        function startQuestion() {
            // Hide the water button and show the quiz
            document.getElementById('water-btn').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('feedback').innerText = ''; // Clear old feedback

            loadQuestion();
        }

        function loadQuestion() {
            const qData = questions[currentStage];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Clear previous options

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, qData.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('feedback');

            if (selected === correct) {
                // Correct Answer!
                feedback.style.color = 'green';
                feedback.innerText = "Correct! Watering the plant...";
                
                // Disable options so they can't click again during animation
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.disabled = true);

                setTimeout(() => {
                    document.getElementById('quiz-container').style.display = 'none';
                    triggerWateringAndGrowth();
                }, 1000);

            } else {
                // Incorrect Answer - Force them to try again
                feedback.style.color = 'red';
                feedback.innerText = "Incorrect! Try again.";
                // The question stays on the screen so they are forced to pick the right one.
            }
        }

        function triggerWateringAndGrowth() {
            const waterDrop = document.getElementById('water-drop');
            const plant = document.getElementById('plant');

            // 1. Play Water Animation
            waterDrop.classList.add('watering');

            // 2. Wait for water to hit the plant, then grow
            setTimeout(() => {
                currentStage++;
                
                // Update plant emoji
                plant.innerText = plantStages[currentStage];
                
                // Play grow bounce animation
                plant.classList.add('growing');

                // Update Progress text
                document.getElementById('progress').innerText = `Stage ${currentStage} / ${totalStages}`;

            }, 800); // 800ms aligns with when the water hits the ground

            // 3. Reset animations and prepare for next stage
            setTimeout(() => {
                waterDrop.classList.remove('watering');
                plant.classList.remove('growing');

                if (currentStage === totalStages) {
                    // Game Over / Win
                    document.getElementById('progress').innerText = "🎉 Congratulations! Your plant is fully grown! 🎉";
                    document.getElementById('progress').style.color = "green";
                } else {
                    // Bring the "Water" button back for the next question
                    document.getElementById('water-btn').style.display = 'inline-block';
                }
            }, 1800);
        }
    </script>
</body>
</html>
